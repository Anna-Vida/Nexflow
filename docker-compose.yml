services:
  postgres:
    image: postgres:17-alpine
    container_name: nexflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexflow
      POSTGRES_PASSWORD: nexflow
      POSTGRES_DB: nexflow
    ports:
      - "5432:5432"
    volumes:
      - nexflow_postgres_data:/var/lib/postgresql/data

volumes:
  nexflow_postgres_data:
